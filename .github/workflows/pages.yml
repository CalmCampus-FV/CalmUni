name: Pages

# Publishes published/ as this repo's own GitHub Pages site.
# Today: https://calmcampus-fv.github.io/CalmUni/<demo>/ . Planned custom domain: uni.calmcampus.app
# (see published/CNAME and AGENTS.md). With an Actions deploy, GitHub ignores the CNAME file:
# the custom domain is switched on in Settings > Pages only once its DNS record exists.
# The links already sent (cc.braunf.com/<demo>/) keep being served by CalmWeb.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Published demo copies are complete
        run: python3 scripts/check-published.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: published
      - id: deployment
        uses: actions/deploy-pages@v5
